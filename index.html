<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hot Wheels Para Ti ❤️</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <!-- Pantalla de Carga -->
  <div id="pantalla-carga">
    <h2 id="texto-carga">Cargando tu ramo de Hot Wheels...</h2>
    <div class="animacion-carrito">🏎️💨</div>
    <div id="porcentaje">0%</div>
  </div>

  <!-- Contenido Principal -->
  <div id="contenido-principal" class="oculto">
    <h1 class="titulo-neon">Feliz Día de los Carritos de Hot Wheels</h1>
    
    <div class="ramo-container">
      <div class="luna">🌕</div>
      <img src="Imágenes/carrinho2.jpg" alt="Ramo de Hot Wheels" class="imagen-ramo">
    </div>

    <!-- Carta Interactiva que rota imagenes -->
    <div class="tarjeta-hotwheels" onclick="cambiarCarta()">
      <div class="empaque">
        <img id="imagen-carrito" src="Imágenes/carrinho1.jpg" alt="Carta Hot Wheels" class="imagen-carrito-card">
        <p class="pista">👆 Haz clic para cambiar de carta</p>
      </div>
    </div>
  </div>

  <script>
    // Simulación de pantalla de carga
    let progreso = 0;
    const porcentajeTexto = document.getElementById('porcentaje');
    const pantallaCarga = document.getElementById('pantalla-carga');
    const contenidoPrincipal = document.getElementById('contenido-principal');

    const intervalo = setInterval(() => {
      progreso += 2;
      porcentajeTexto.textContent = progreso + '%';

      if (progreso >= 100) {
        clearInterval(intervalo);
        pantallaCarga.classList.add('oculto');
        contenidoPrincipal.classList.remove('oculto');
      }
    }, 40);

    // Lista de tarjetas intercambiables
    const tarjetas = [
      "Imágenes/carrinho1.jpg",
      "Imágenes/ramo.png"
    ];

    let indice = 0;

    function cambiarCarta() {
      indice = (indice + 1) % tarjetas.length;
      const img = document.getElementById('imagen-carrito');
      
      // Efecto suave al cambiar
      img.style.opacity = 0;
      setTimeout(() => {
        img.src = tarjetas[indice];
        img.style.opacity = 1;
      }, 200);
    }
  </script>
</body>
</html>
