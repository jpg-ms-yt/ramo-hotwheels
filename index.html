<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hot Wheels Para Ti ❤️</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <!-- Pantalla de Carga -->
  <div id="pantalla-carga">
    <h2 id="texto-carga">Cargando tu ramo de Hot Wheels...</h2>
    <div class="animacion-carrito">🏎️💨</div>
    <div id="porcentaje">0%</div>
  </div>

  <!-- Contenido Principal -->
  <div id="contenido-principal" class="oculto">
    <h1 class="titulo">Feliz Día de los Carritos de Hot Wheels</h1>

    <!-- Ramo de Flores con Hot Wheels -->
    <div class="ramo-container">
      <div class="luna">🌕</div>
      <img src="Imagenes/carrinho2.jpg" alt="Ramo de Hot Wheels" class="imagen-ramo">
    </div>

    <!-- Carta Interactiva que rota imagenes -->
    <div class="tarjeta-hotwheels" onclick="cambiarCarta()">
      <div class="empaque">
        <img id="imagen-carrito" src="Imagenes/carrinho1.jpg" alt="Carta Hot Wheels" class="imagen-carrito-card">
        <p class="pista">👆 Haz clic para cambiar de carta</p>
      </div>
    </div>
  </div>

  <script>
    // Pantalla de Carga 0% a 100%
    let porcentaje = 0;
    const elementoPorcentaje = document.getElementById('porcentaje');
    const pantallaCarga = document.getElementById('pantalla-carga');
    const contenido = document.getElementById('contenido-principal');

    const intervalo = setInterval(() => {
      porcentaje += 2;
      elementoPorcentaje.textContent = porcentaje + '%';

      if (porcentaje >= 100) {
        clearInterval(intervalo);
        pantallaCarga.style.display = 'none';
        contenido.classList.remove('oculto');
      }
    }, 40);

    // Lista de tarjetas intercambiables
    const tarjetas = [
      "Imagenes/carrinho1.jpg",
      "Imagenes/ramo.png"
    ];
    let indice = 0;

    function cambiarCarta() {
      indice = (indice + 1) % tarjetas.length;
      document.getElementById('imagen-carrito').src = tarjetas[indice];
    }
  </script>
</body>
</html>
